# 如果需要快速把 docker run 指令转化为 docker compose 配置可以考虑使用这个插件 https://plugins.jetbrains.com/plugin/23108-docker-run-command-to-compose-converter

# 网络
networks:
  work-network:
    name: work-network

# 服务(服务名称、运行说明、镜像文件、容器名称、启动方式、网络端口、存储方式、环境变量、启动指令、设主程序、默认参数、资源控制)
services:
  work-caddy:
    # NOTE: 整个公司项目的网关层, 所有的请求都会引导到这里在分流给其他服务
    image: caddy:2.10.0
    container_name: work-caddy
    restart: always
    networks:
      - work-network
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019"
    working_dir: /etc/caddy/
    volumes:
      - "./work-basic-component/work-caddy/Caddyfile:/etc/caddy/Caddyfile" # 代理配置文件

  work-mysql:
    image: mysql:8.0.41
    container_name: work-mysql
    restart: always
    networks:
      - work-network
    ports:
      - "3306:3306"
    volumes:
      - "./work-basic-component/work-mysql/memory/:/var/lib/mysql/" # 持久目录
      - "./work-basic-component/work-mysql/share/:/share" # 共享目录
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

  work-etcd:
    # NOTE: 这里启动参数有点多稍微解读一下
    # --name etcd0 --> 本节点名称
    # --data-dir /etcd-data --> 持久化目录
    # --initial-cluster-token etcd-cluster-1 --> 标识某个 etcd 集群的唯一 token, 主要用于防止不同集群之间的数据混淆或冲突
    # --initial-cluster-state new --> 表示在 etcd 启动时, 集群的状态是新建(如果使用 existing 则是加入到集群中, 会同步集群的信息)
    # --listen-client-urls --> 客户端与 etcd 通信
    # --advertise-client-urls --> 客户端与 etcd 通信
    # --listen-peer-urls --> 多节点部署用到
    # --initial-advertise-peer-urls --> 多节点部署用到
    # --initial-cluster --> 指定 etcd 集群中已有的节点
    image: gcr.io/etcd-development/etcd:v3.6.0-rc.4
    container_name: work-etcd
    restart: always
    networks:
      - work-network
    ports:
      - "2379:2379" # 客户端通信端口
      - "2380:2380" # 节点间通信端口
    volumes:
      - "./work-basic-component/work-etcd/etcd-data/:/etcd-data/"
    command: >
      /usr/local/bin/etcd
      --name etcd0
      --data-dir /etcd-data
      --initial-cluster-token etcd-cluster-1
      --initial-cluster-state new
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://0.0.0.0:2379
      --listen-peer-urls http://0.0.0.0:2380
      --initial-advertise-peer-urls http://0.0.0.0:2380
      --initial-cluster etcd0=http://0.0.0.0:2380

  work-tidb:
    image: pingcap/tidb
    container_name: work-tidb
    restart: always
    networks:
      - work-network
    ports:
      - "4000:4000"

  work-redis:
    image: redis:7.4.2
    container_name: work-redis
    restart: always
    networks:
      - work-network
    ports:
      - "6379:6379"
    volumes:
      - "./work-basic-component/work-redis/memory/:/var/lib/redis/" # 持久目录
      - "./work-basic-component/work-redis/share/:/share" # 共享目录
    command: /bin/sh -c "redis-server --requirepass $REDIS_ROOT_PASSWORD"

  work-pulsar:
    image: apachepulsar/pulsar:4.0.3
    container_name: work-pulsar
    restart: always
    networks:
      - work-network
    ports:
      - "6650:6650"
      - "8080:8080"
    command: bin/pulsar standalone

  # work-minio:

  work-sentinel:
    # NOTE: 由于官方没有制作为镜像文件因此需要我们自己制作
    build:
      context: ./work-basic-component/work-sentinel/
      dockerfile: Dockerfile
    image: sentinel:1.8.6
    restart: always
    container_name: work-sentinel
    networks:
      - work-network
    ports:
      - "8131:8131"
    command:
      - "java"
      - "-Dserver.port=8131"
      - "-Dsentinel.dashboard.auth.username=sentinel"
      - "-Dsentinel.dashboard.auth.password=Qwe54188_"
      - "-Dserver.servlet.session.timeout=86400"
      - "-jar"
      - "app.jar"

  work-ollama:
    # NOTE: 安装 ollama 后如果需要支持 GPU 则需要做以下操作
    # $ curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey \
    #    | sudo gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
    # $ curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list \
    #    | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' \
    #    | sudo tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
    # $ sudo apt-get update && sudo apt-get install -y nvidia-container-toolkit
    # $ sudo nvidia-ctk runtime configure --runtime=docker && sudo systemctl restart docker
    # 然后重新运行集群即可
    image: ollama/ollama
    container_name: work-ollama
    restart: "always"
    networks:
      - work-network
    ports:
      - "11434:11434"
    volumes:
      - "./work-basic-component/work-ollama:/root/.ollama"
    entrypoint:
      - "/bin/ollama"
    command:
      - "serve"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [ gpu ]

  work-nacos:
    # NOTE: Nacos 貌似没有环境变量可以直接初始化用户密码, 因此最好不要彻底重启 Nacos, 否则权限验证会失效
    image: nacos/nacos-server:v2.5.1
    container_name: work-nacos
    restart: always
    networks:
      - work-network
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone # 单机部署模式
      NACOS_AUTH_TOKEN: au3y/JinInzSQu5hxaQQSiyvN3kMcfgOLcFRA4AHrUE= # 使用 openssl rand -base64 32 生成
      NACOS_AUTH_IDENTITY_KEY: username
      NACOS_AUTH_IDENTITY_VALUE: root
      NACOS_AUTH_ENABLE: true # 开启权限系统

  work-elasticsearch:
    # NOTE: ES 的启动及其损耗内存, 因此对其做了限制, 此外由于默认不支持中文, 还需要覆盖内部的配置文件, 以及下载额外的中文分词器插件
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.28
    container_name: work-elasticsearch
    restart: "always"
    networks:
      - work-network
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=Qwe54188_
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
      - ELASTIC_CONTAINER=true
    entrypoint:
      - "sh"
      - "-c"
      - "
        \  if [ ! -d /usr/share/elasticsearch/plugins/analysis-ik ]; then
        \    echo 'Installing IK plugin...';
        \    elasticsearch-plugin install --batch https://release.infinilabs.com/analysis-ik/stable/elasticsearch-analysis-ik-7.17.28.zip;
        \  fi;
        \  exec docker-entrypoint.sh\n"

  work-kibana:
    image: docker.elastic.co/kibana/kibana:7.17.28
    container_name: work-kibana
    restart: always
    networks:
      - work-network
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://work-elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=Qwe54188_
      - ELASTIC_CONTAINER=true
    volumes:
      - "./work-basic-component/work-kibana/kibana.yml:/usr/share/kibana/config/kibana.yml"

  work-alist:
    # NOTE: 由于官方强制要求密码重置, 因此每次新的启动管理员都需要重置密码 docker exec -it work-alist ./alist admin set Qwe54188_
    image: 'xhofe/alist:beta'
    container_name: work-alist
    restart: always
    networks:
      - work-network
    ports:
      - "5244:5244"
    environment:
      PUID: 0
      PGID: 0
      UMASK: 022
    volumes:
      - "./work-basic-component/work-alist/memory/:/opt/alist/data"
      - "./work-basic-component/work-alist/share/:/share"

  work-hkworker:
    # NOTE: 由于官方没有制作为镜像文件因此需要我们自己制作, 而且配置过程也很粗糙
    build:
      context: ./work-basic-component/work-hotkey/worker/
      dockerfile: Dockerfile
    image: work-hkworker:1.0.0
    container_name: work-hkworker
    restart: always
    networks:
      - work-network
    ports:
      - "8111:8111"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

  work-hkdashboard:
    # NOTE: 由于官方没有制作为镜像文件因此需要我们自己制作, 而且配置过程也很粗糙
    build:
      context: ./work-basic-component/work-hotkey/dashboard/
      dockerfile: Dockerfile
    image: work-hkdashboard:1.0.0
    container_name: work-hkdashboard
    restart: always
    networks:
      - work-network
    ports:
      - "8121:8121"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

  work-curl:
    image: curlimages/curl
    container_name: work-curl
    restart: always
    networks:
      - work-network
    command: tail -f /dev/null

  work-user-centre:
    build:
      context: ./work-user-centre/
      dockerfile: Dockerfile
    image: work-user-centre:1.0.0
    container_name: work-user-centre
    restart: always
    networks:
      - work-network
    ports:
      - "8003:8000"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

  work-massive-likes:
    build:
      context: ./work-massive-likes/
      dockerfile: Dockerfile
    image: work-massive-like:1.0.0
    container_name: work-massive-likes
    restart: always
    networks:
      - work-network
    ports:
      - "8004:8000"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

  work-question-bank:
    build:
      context: ./work-question-bank/
      dockerfile: Dockerfile
    image: work-question-bank:1.0.0
    container_name: work-question-bank
    restart: always
    networks:
      - work-network
    ports:
      - "8005:8000"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

  work-collaborative-images:
    build:
      context: ./work-collaborative-images/
      dockerfile: Dockerfile
    image: work-collaborative-images:1.0.0
    container_name: work-collaborative-images
    restart: always
    networks:
      - work-network
    ports:
      - "8006:8000"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      COS_CLIENT_HOST: ${COS_CLIENT_HOST}
      COS_CLIENT_SECRET_ID: ${COS_CLIENT_SECRET_ID}
      COS_CLIENT_SECRET_KEY: ${COS_CLIENT_SECRET_KEY}
      COS_CLIENT_REGION: ${COS_CLIENT_REGION}
      COS_CLIENT_BUCKET: ${COS_CLIENT_BUCKET}

  # !!!
  work-question-bank-frontend:
    build:
      context: ./work-question-bank/frontend/
      dockerfile: Dockerfile
    image: work-question-bank-frontend:1.0.0
    container_name: work-question-bank-frontend
    restart: always
    networks:
      - work-network
    ports:
      - "3005:3000"
    environment:
      HOSTNAME: 0.0.0.0

  work-collaborative-images-client:
    build:
      context: ./work-collaborative-images/client/work-collaborative-images-vue/
      dockerfile: Dockerfile
    image: work-collaborative-images-client:1.0.0
    container_name: work-collaborative-images-client
    restart: always
    networks:
      - work-network
    ports:
      - "3006:3000"
